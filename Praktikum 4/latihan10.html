<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Javascript Platfrom</title>
</head>
<body>
    <h1>Belajar Javascript</h1>
    <div id="hasil"></div>
    <script>
        var text = "";
        for (var x = 0; x <= 10; x++) {
            text += "Angka" + x + "<br>";
        }
        document.getElementById("hasil").innerHTML= text;
    </script>
</body>
</html>
