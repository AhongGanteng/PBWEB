<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Javascript Platfrom</title>
</head>
<body>
    <h1>Belajar Javascript</h1>
    <div id="penjumlahan"></div>
    <div id="pengurangan"></div>
    <div id="perkalian"></div>
    <div id="pembagian"></div>
    <div id="modulus"></div>
    <script>
        var bil1 = 6;
        var bil2 = 2;
        var penjumlahan = bil1 + bil2;
        var pengurangan = bil1 - bil2;
        var perkalian = bil1 * bil2;
        var pembagian = bil1 / bil2;
        var modulus = bil1 % bil2;

        document.getElementById("penjumlahan").innerHTML = penjumlahan;
        document.getElementById("pengurangan").innerHTML = pengurangan;
        document.getElementById("perkalian").innerHTML = perkalian;
        document.getElementById("permbagian").innerHTML = pembagian;
        document.getElementById("modulus").innerHTML = modulus;
    </script>
</body>
</html>
