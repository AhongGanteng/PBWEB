<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kalkulator Sederhana</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="kalkulator">
        <h1>KALKULATOR SEDERHANA</h1>
        <div class="input">
            <label>Bilangan 1</label>
            <input id="Bilangan1" type="number" placeholder="Masukkan bilangan 1">
        </div>
        <div class="input">
            <label>Bilangan 2</label>
            <input id="Bilangan2" type="number" placeholder="Masukkan bilangan 2">
        </div>
        <div class="buttons">
            <button onclick="Tambah()">
                Tambah
            </button>
            <button onclick="Kurang()">
                Kurang
            </button>
            <button onclick="Kali()">
                Kali
            </button>
            <button onclick="Bagi()">
                Bagi
            </button>
            <button onclick="Modulus()">
                Modulus
            </button>
            <button onclick="HapusHasil()"> 
                Hapus hasil
            </button>
        </div>
        <div class="hasil">
            <label>Hasil</label>
            <input id="hasil" readonly>
        </div>
    </div>
    <script src="ScriptKalkulator.js"></script>
</body>
</html>
