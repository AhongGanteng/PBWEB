<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <form id="form-login">
        <header>
            <div>
                <img src="2025 - LOGO USD RESMI.png">
                <h1>Formulir Pendaftaran</h1>
            </div>
        </header>
        <main>
            <div>
                <label for="kode-pembayaran">Kode Pembayaran</label>
                <input id="kode-pembayaran" type="number" required minlength="1" placeholder="Harus angka!">
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
        </main>
    </form>
    <script src="Script.js"></script>
</body>
</html>
